name: ii_agent
description: Cross-platform Flutter UI for a local coding agent with OpenAI-compatible model profiles.
publish_to: 'none'
version: 1.61.0+68

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  archive: ^4.0.7
  crypto: ^3.0.6
  xml: ^6.5.0
  html: ^0.15.6
  path_provider: ^2.1.6
  flutter_pty: ^0.4.2
  xterm: ^4.0.0
  webview_flutter: ^4.14.0
  webview_windows: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
